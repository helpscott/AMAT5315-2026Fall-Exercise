[package]
name = "week4-fluid"
version = "0.1.0"
edition = "2021"

[lib]
name = "week4_fluid"
path = "src/lib.rs"

[[bin]]
name = "field"
path = "src/bin/field.rs"

[[bin]]
name = "fluid"
path = "src/bin/fluid.rs"

[dependencies]
num-complex = "0.4"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
